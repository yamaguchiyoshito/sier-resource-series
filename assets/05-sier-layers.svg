<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615" role="img" aria-label="事業、統制、生産、組織能力、資源の5層を積層で示し、案件横断の資産を形成するL2を強調した図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">AI駆動型SIerの5層モデル</text>
<rect x="120" y="90" width="760" height="78" rx="12" fill="#e1edf8" stroke="#8ea6b2" stroke-width="1"/>
<text x="150" y="137" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="700" fill="#223e53">L5 事業</text>
<text x="330" y="126" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#36556d">顧客価値を収益に変える</text>
<text x="330" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">評価：売上総利益、継続率、価値提供</text>
<rect x="120" y="180" width="760" height="78" rx="12" fill="#e0f0e9" stroke="#8ea6b2" stroke-width="1"/>
<text x="150" y="227" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="700" fill="#223e53">L4 統制</text>
<text x="330" y="216" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#36556d">品質・リスク・責任を制御する</text>
<text x="330" y="238" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">評価：欠陥流出、承認時間、重大事故</text>
<rect x="120" y="270" width="760" height="78" rx="12" fill="#f7e9d4" stroke="#8ea6b2" stroke-width="1"/>
<text x="150" y="317" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="700" fill="#223e53">L3 生産</text>
<text x="330" y="306" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#36556d">人間とAIで成果物を作る</text>
<text x="330" y="328" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">評価：完成スループット、工数、リードタイム</text>
<rect x="120" y="360" width="760" height="78" rx="12" fill="#e9e4f5" stroke="#c0604a" stroke-width="3"/>
<text x="150" y="407" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="700" fill="#223e53">L2 組織能力</text>
<text x="330" y="396" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#36556d">生産方法を再利用・標準化する</text>
<text x="330" y="418" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">評価：資産適用率、実測効果、保守費</text>
<rect x="120" y="450" width="760" height="78" rx="12" fill="#f6e4e8" stroke="#8ea6b2" stroke-width="1"/>
<text x="150" y="497" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="700" fill="#223e53">L1 資源</text>
<text x="330" y="486" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#36556d">必要な資源を調達・育成する</text>
<text x="330" y="508" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">評価：技術力、投資額、調達費、能力充足</text>
<text x="130" y="92" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75" transform="translate(200 -14)">経営上の責任 ／ 評価すべきもの</text>
<text x="500" y="560" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#c0604a">L2が案件横断の経営資産を形成する層。個別案件へのAI導入だけではL3の局所改善に留まる</text>
<text x="500" y="590" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">5層を別々に管理するのではなく、企業全体の価値創出システムとして管理する</text>
</svg>
