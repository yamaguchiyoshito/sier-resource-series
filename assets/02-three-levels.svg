<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="基礎資源を統合して組織能力にし、組織能力を再構成する変革能力までの3階層を下から上へ示す図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">資源と能力の3階層</text>
<rect x="120" y="100" width="760" height="86" rx="12" fill="#f7e9d4" stroke="#8ea6b2" stroke-width="1"/><text x="500" y="139" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#223e53">Level 3　変革能力 Dynamic Capability</text><text x="500" y="163" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">既存の資源や能力を創出・変更・再構成する。例：モデル更新を受けてテスト方式と責任分担を変える</text>
<rect x="120" y="230" width="760" height="86" rx="12" fill="#e0f0e9" stroke="#8ea6b2" stroke-width="1"/><text x="500" y="269" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#223e53">Level 2　組織能力 Capability</text><text x="500" y="293" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">複数の資源を組み合わせ、成果を反復して生む。例：仕様からテストを設計し、実行・検証する</text>
<rect x="120" y="360" width="760" height="86" rx="12" fill="#e1edf8" stroke="#8ea6b2" stroke-width="1"/><text x="500" y="399" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#223e53">Level 1　基礎資源 Resource</text><text x="500" y="423" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">企業が保有・利用できるもの。例：技術者、GitLab、Playwright、Agent Skill、業務仕様</text>
<path d="M500.0 360.0 L500.0 328.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="500.0,318.0 507.0,330.0 493.0,330.0" fill="#607a91"/>
<text x="520" y="342" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#607a91">統合して、反復可能な成果にする</text>
<path d="M500.0 230.0 L500.0 198.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="500.0,188.0 507.0,200.0 493.0,200.0" fill="#607a91"/>
<text x="520" y="212" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#607a91">能力そのものを作り替える</text>
<text x="500" y="492" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">保有量と組織能力の大きさは比例しない。Skillを100個持つことと、10個のSkillで成果を反復することは別である</text>
</svg>
