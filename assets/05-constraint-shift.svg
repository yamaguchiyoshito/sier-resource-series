<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-label="AI導入後の5工程の処理能力の棒グラフ。実装40件/日に対しレビュー12件/日が制約で、次の制約はリリース15件/日">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">AI導入後に制約はどこへ移るか</text>
<path d="M110 120 V480 H890" stroke="#8ea6b2" stroke-width="2" fill="none"/>
<rect x="144.3" y="316.4" width="87.4" height="163.6" rx="4" fill="#9dbbd3"/>
<text x="188" y="308" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">20</text>
<text x="188" y="504" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">設計</text>
<rect x="300.3" y="152.7" width="87.4" height="327.3" rx="4" fill="#9dbbd3"/>
<text x="344" y="145" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">40</text>
<text x="344" y="504" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">実装</text>
<rect x="456.3" y="381.8" width="87.4" height="98.2" rx="4" fill="#c0604a"/>
<text x="500" y="374" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">12</text>
<text x="500" y="504" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">レビュー</text>
<rect x="612.3" y="332.7" width="87.4" height="147.3" rx="4" fill="#9dbbd3"/>
<text x="656" y="325" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">18</text>
<text x="656" y="504" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">検証</text>
<rect x="768.3" y="357.3" width="87.4" height="122.7" rx="4" fill="#9dbbd3" stroke="#c0604a" stroke-width="3" stroke-dasharray="6 4"/>
<text x="812" y="349" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">15</text>
<text x="812" y="504" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#36556d">リリース</text>
<path d="M110 381.8 H890" stroke="#c0604a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="500" y="530" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">実装を40件/日まで増やしても完成は12件/日（破線）。レビューを改善すると、次はリリース（15件/日、点線枠）が制約になり得る</text>
<text x="500" y="562" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">全作業が5工程を1回ずつ通過し、各件の作業量が同一で、手戻り・変動・並列処理の干渉を無視した仮想モデル</text>
</svg>
