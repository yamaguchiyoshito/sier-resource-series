<text x="638" y="376" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0604a">撤退</text>
<text x="638" y="394" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">学びを記録</text>
<rect x="678" y="190" width="130" height="120" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="743" y="226" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">経済価値</text>
<text x="743" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">純便益と回収期間</text>
<path d="M692 290 H794" stroke="#8ea6b2" stroke-width="2" stroke-dasharray="3 5"/>
<path d="M812.0 290.0 L820.0 290.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="830.0,290.0 818.0,297.0 818.0,283.0" fill="#607a91"/>
<rect x="832" y="200" width="150" height="100" rx="12" fill="#f6e4e8" stroke="#8ea6b2"/>
<text x="907" y="236" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">既存能力の深化へ</text>
<text x="907" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Skill・CIへ展開</text>
<path d="M846 290 H968" stroke="#8ea6b2" stroke-width="2" stroke-dasharray="3 5"/>
<text x="500" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">投入資源は段階ごとに増やし、評価基準は段階ごとに変える（成立性 → 適用性 → 経済価値）</text>
<text x="500" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">短期ROIだけで評価すると能力が形成される前に打ち切られ、評価せずに続ければ資源を消耗する。撤退条件を事前に決める</text>
