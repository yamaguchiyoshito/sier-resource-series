<text x="542" y="226" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">実務適用性</text>
<text x="542" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">案件で使えるか</text>
