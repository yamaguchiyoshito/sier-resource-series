<text x="216" y="376" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0604a">撤退</text>
<text x="216" y="394" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">学びを記録</text>
