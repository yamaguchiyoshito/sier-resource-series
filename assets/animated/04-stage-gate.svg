<text x="110" y="226" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">小規模な技術検証</text>
<text x="110" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">数十時間・1〜2名</text>
