<circle cx="720" cy="250" r="17" fill="none" stroke="#607a91" stroke-width="6" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0667;0.0967;0.1667;0.2667;0.2967;0.3667;0.4667;0.4967;0.5667;0.6667;0.6967;0.7667;0.8667;0.8967;0.9667;1.0000" values="0.000;0.000;0.800;0.000;0.000;0.800;0.000;0.000;0.800;0.000;0.000;0.800;0.000;0.000;0.800;0.000;0.000"/></circle>
<circle cx="920" cy="250" r="17" fill="none" stroke="#607a91" stroke-width="6" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0300;0.1000;0.2000;0.2300;0.3000;0.4000;0.4300;0.5000;0.6000;0.6300;0.7000;0.8000;0.8300;0.9000;1.0000" values="0.000;0.800;0.000;0.000;0.800;0.000;0.000;0.800;0.000;0.000;0.800;0.000;0.000;0.800;0.000;0.000"/></circle>
<path d="M320 292 V300 H520 V292" fill="none" stroke="#c0604a" stroke-width="3" opacity="0.3"><animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" values="0.3;1.0;0.3"/></path>
</g>
