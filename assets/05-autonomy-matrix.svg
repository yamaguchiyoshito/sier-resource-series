<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655" role="img" aria-label="失敗の影響と検証可能性の2軸にA0からA4の自律度を配置した図。UI表示修正は高自律、決済ロジック変更は低自律">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">AIの自律度はリスクと検証可能性で決める</text>
<rect x="130" y="118" width="810" height="442" fill="#eef3f1" stroke="#8ea6b2"/>
<path d="M130.0 590.0 L930.0 590.0" stroke="#8ea6b2" stroke-width="2" fill="none"/><polygon points="940.0,590.0 928.0,597.0 928.0,583.0" fill="#8ea6b2"/>
<text x="535" y="618" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">失敗の影響（小 → 大）</text>
<path d="M100.0 560.0 L100.0 128.0" stroke="#8ea6b2" stroke-width="2" fill="none"/><polygon points="100.0,118.0 107.0,130.0 93.0,130.0" fill="#8ea6b2"/>
<text x="70" y="339" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53" transform="rotate(-90 70 339)">独立した検証で失敗を検出できる確率（低 → 高）</text>
<rect x="135" y="123" width="152" height="78" rx="12" fill="#e1edf8" stroke="#8ea6b2"/>
<text x="211" y="158" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">A4 統制下の自律運用</text>
<text x="211" y="179" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">定義範囲で工程を遂行</text>
<rect x="297" y="211" width="152" height="78" rx="12" fill="#e0f0e9" stroke="#8ea6b2"/>
<text x="373" y="247" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">A3 条件付き統合</text>
<text x="373" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">基準を満たせば自動反映</text>
<rect x="459" y="300" width="152" height="78" rx="12" fill="#f7e9d4" stroke="#8ea6b2"/>
<text x="535" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">A2 検証付き実行</text>
<text x="535" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">実行し証跡を残す</text>
<rect x="621" y="388" width="152" height="78" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="697" y="423" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">A1 生成</text>
<text x="697" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">生成し、人間が採否</text>
<rect x="783" y="477" width="152" height="78" rx="12" fill="#f6e4e8" stroke="#8ea6b2"/>
<text x="859" y="512" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">A0 提案</text>
<text x="859" y="533" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">提案のみ、人間が判断</text>
<text x="697" y="193" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">影響が大きくても検出確率が高ければ A2〜A3</text>
<text x="697" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">（自動回帰テストと証跡で担保）</text>
<text x="373" y="458" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">影響が小さくても検出できなければ A1 止まり</text>
<text x="373" y="485" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">（検証手段を先に作る）</text>
<path d="M292 206 L454 149" stroke="#607a91" stroke-width="1.5"/>
<circle cx="292" cy="206" r="8" fill="#607a91" stroke="#fff" stroke-width="2"/>
<text x="462" y="145" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#607a91">例：UIコンポーネントの表示修正 → A3〜A4</text>
<path d="M778 472 L616 533" stroke="#c0604a" stroke-width="1.5"/>
<circle cx="778" cy="472" r="8" fill="#c0604a" stroke="#fff" stroke-width="2"/>
<text x="608" y="538" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0604a">例：決済金額の計算ロジック変更 → A0〜A1</text>
<text x="500" y="628" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">提案モデル（公的規格ではない）。自律度はAIの能力ではなく、失敗の影響と独立検証で検出できる確率で決める</text>
</svg>
