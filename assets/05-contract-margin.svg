<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="638" viewBox="0 0 1000 638" role="img" aria-label="固定価格契約では粗利益が400万円から600万円へ増え、時間精算契約では400万円から200万円へ減る棒グラフ">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">同じ40%の工数削減でも、契約方式で粗利益は逆に動く</text>
<path d="M120 120 V460 H920" stroke="#8ea6b2" stroke-width="2" fill="none"/>
<text x="108" y="465" text-anchor="end" font-family="sans-serif" font-size="14" fill="#36556d">0</text>
<path d="M120 460.0 H920" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="2 6"/>
<text x="108" y="418" text-anchor="end" font-family="sans-serif" font-size="14" fill="#36556d">100</text>
<path d="M120 412.9 H920" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="2 6"/>
<text x="108" y="371" text-anchor="end" font-family="sans-serif" font-size="14" fill="#36556d">200</text>
<path d="M120 365.7 H920" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="2 6"/>
<text x="108" y="324" text-anchor="end" font-family="sans-serif" font-size="14" fill="#36556d">300</text>
<path d="M120 318.6 H920" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="2 6"/>
<text x="108" y="276" text-anchor="end" font-family="sans-serif" font-size="14" fill="#36556d">400</text>
<path d="M120 271.4 H920" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="2 6"/>
<text x="108" y="229" text-anchor="end" font-family="sans-serif" font-size="14" fill="#36556d">500</text>
<path d="M120 224.3 H920" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="2 6"/>
<text x="108" y="182" text-anchor="end" font-family="sans-serif" font-size="14" fill="#36556d">600</text>
<path d="M120 177.1 H920" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="2 6"/>
<text x="108" y="135" text-anchor="end" font-family="sans-serif" font-size="14" fill="#36556d">700</text>
<path d="M120 130.0 H920" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="2 6"/>
<text x="60" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53" transform="rotate(-90 60 290)">粗利益（万円）</text>
<rect x="170" y="271.4" width="110" height="188.6" rx="4" fill="#9dbbd3"/>
<text x="225" y="263" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">400</text>
<text x="225" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">従来</text>
<rect x="310" y="177.1" width="110" height="282.9" rx="4" fill="#5aa06f"/>
<text x="365" y="169" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">600</text>
<text x="365" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">AI導入後</text>
<text x="300" y="516" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">固定価格契約</text>
<text x="300" y="540" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#5aa06f">粗利益 +200万円（売上 1000 → 1000万円）</text>
<rect x="570" y="271.4" width="110" height="188.6" rx="4" fill="#9dbbd3"/>
<text x="625" y="263" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">400</text>
<text x="625" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">従来</text>
<rect x="710" y="365.7" width="110" height="94.3" rx="4" fill="#c0604a"/>
<text x="765" y="358" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">200</text>
<text x="765" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">AI導入後</text>
<text x="700" y="516" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">時間精算契約</text>
<text x="700" y="540" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0604a">粗利益 −200万円（売上 1000 → 600万円）</text>
<text x="500" y="588" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">緑＝粗利益の増加、赤＝減少。仮想値：従来1,000h → 600h、原価6,000円/h、AI費40万円</text>
<text x="500" y="610" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">固定価格は契約額不変、時間精算は600hを1万円/hで全額請求と仮定</text>
</svg>
