<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="強化ループ（開発活動→経験→標準・Skill→生産性→改善機会）と抑制ループ（AI実装増→レビュー待ち→リードタイム悪化→完了量制約→投入抑制）">
