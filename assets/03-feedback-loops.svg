<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="強化ループ（開発活動→経験→標準・Skill→生産性→改善機会）と抑制ループ（AI実装増→レビュー待ち→リードタイム悪化→完了量制約）">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="51" text-anchor="start" font-family="sans-serif" font-size="27" font-weight="700" fill="#18324b">強化ループと抑制ループ</text>
<text x="250" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">強化ループ R：成果が次の成果を生む</text>
<text x="750" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">抑制ループ B：成長が新しい制約を生む</text>
<path d="M500 90 V640" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="4 6"/>
<circle cx="250" cy="380" r="180" fill="none" stroke="#607a91" stroke-width="3"/>
<polygon points="364.7,240.8 353.2,222.6 343.8,235.6" fill="#607a91"/>
<polygon points="417.8,446.1 431.6,429.5 416.4,424.6" fill="#607a91"/>
<polygon points="239.0,560.0 259.0,568.0 259.0,552.0" fill="#607a91"/>
<polygon points="75.4,425.2 74.0,446.7 89.2,441.7" fill="#607a91"/>
<polygon points="153.1,227.9 132.2,233.2 141.6,246.1" fill="#607a91"/>
<rect x="175" y="173" width="150" height="54" rx="12" fill="#e1edf8" stroke="#8ea6b2"/><text x="250" y="196" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">開発活動</text><text x="250" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36556d">案件の遂行</text>
<rect x="346" y="297" width="150" height="54" rx="12" fill="#e0f0e9" stroke="#8ea6b2"/><text x="421" y="320" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">経験</text><text x="421" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36556d">障害対応・判断</text>
<rect x="281" y="499" width="150" height="54" rx="12" fill="#f7e9d4" stroke="#8ea6b2"/><text x="356" y="522" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">標準・Skill</text><text x="356" y="546" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36556d">形式化・配布</text>
<rect x="69" y="499" width="150" height="54" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/><text x="144" y="522" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">生産性向上</text><text x="144" y="546" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36556d">工数減・品質向上</text>
<rect x="4" y="297" width="150" height="54" rx="12" fill="#f6e4e8" stroke="#8ea6b2"/><text x="79" y="320" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">改善機会</text><text x="79" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36556d">余力と知見</text>
<circle cx="250" cy="380" r="28" fill="#fcfdfd" stroke="#607a91" stroke-width="2"/>
<text x="250" y="389" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">R</text>
<circle cx="750" cy="380" r="180" fill="none" stroke="#607a91" stroke-width="3"/>
<polygon points="885.1,260.5 876.6,240.7 865.3,252.0" fill="#607a91"/>
<polygon points="869.5,515.1 889.3,506.6 878.0,495.3" fill="#607a91"/>
<polygon points="614.9,499.5 623.4,519.3 634.7,508.0" fill="#607a91"/>
<polygon points="630.5,244.9 610.7,253.4 622.0,264.7" fill="#607a91"/>
<rect x="665" y="173" width="170" height="54" rx="12" fill="#f7e9d4" stroke="#8ea6b2"/><text x="750" y="196" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">AI実装量の増加</text><text x="750" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36556d">流入が増える</text>
<rect x="845" y="353" width="170" height="54" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/><text x="930" y="376" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">レビュー待ち増加</text><text x="930" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36556d">滞留Stock</text>
<rect x="665" y="533" width="170" height="54" rx="12" fill="#f6e4e8" stroke="#8ea6b2"/><text x="750" y="556" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">リードタイム悪化</text><text x="750" y="580" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36556d">提供速度の低下</text>
<rect x="485" y="353" width="170" height="54" rx="12" fill="#e1edf8" stroke="#8ea6b2"/><text x="570" y="376" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">完了量の制約</text><text x="570" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36556d">投入を抑える圧力</text>
<circle cx="750" cy="380" r="28" fill="#fcfdfd" stroke="#607a91" stroke-width="2"/>
<text x="750" y="389" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">B</text>
<text x="250" y="628" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">条件：経験が検証・共有され、標準やSkillへ反映されること</text>
<text x="750" y="628" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">対策：WIP制限、レビュー自動化、承認権限の再設計</text>
<text x="500" y="668" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d6c75">R は同方向に増幅する循環、B は目標との偏差を縮める循環。経験が個人に閉じると R は途中で断絶する</text>
</svg>
