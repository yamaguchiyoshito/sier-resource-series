<rect x="665" y="530" width="160" height="54" rx="12" fill="#f6e4e8" stroke="#8ea6b2" stroke-width="1"/><text x="745" y="553" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">リードタイム悪化</text><text x="745" y="577" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">提供速度の低下</text>
<rect x="493" y="358" width="160" height="54" rx="12" fill="#e1edf8" stroke="#8ea6b2" stroke-width="1"/><text x="573" y="381" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">完了量の制約</text><text x="573" y="405" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">投入を抑える圧力</text>
<circle cx="745" cy="385" r="30" fill="#fcfdfd" stroke="#607a91" stroke-width="2"/>
<text x="745" y="394" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">B</text>
<text x="250" y="630" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">成立条件：経験が検証・共有され、標準やSkillへ反映されること</text>
<text x="750" y="630" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">対策：WIP制限、レビュー自動化、承認権限の再設計</text>
<text x="500" y="672" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">＋は同方向、−は逆方向の因果。Rは＋だけで増幅し、Bは−を1つ含み目標との偏差を縮める。経験が個人に閉じるとRは途中で断絶する</text>
