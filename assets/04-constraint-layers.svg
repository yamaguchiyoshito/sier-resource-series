<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="775" viewBox="0 0 1000 775" role="img" aria-label="物理・能力、フロー、制度・意思決定、市場・戦略の4階層を同心の枠で示し、制約が内側から外側へ移ることを示す図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">制約は4つの階層に分けて管理する</text>
<rect x="40" y="85" width="920" height="605" rx="16" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="58" y="115" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">④ 市場・戦略制約</text>
<text x="58" y="139" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">例：顧客需要不足、収益モデルの限界</text>
<text x="58" y="161" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">対策：提供価値・価格・事業モデルの変更</text>
<rect x="115" y="185" width="770" height="505" rx="16" fill="#f7e9d4" stroke="#8ea6b2"/>
<text x="133" y="215" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">③ 制度・意思決定制約</text>
<text x="133" y="239" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">例：過剰な承認、権限集中</text>
<text x="133" y="261" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">対策：権限委譲・ルール変更</text>
<rect x="190" y="285" width="620" height="405" rx="16" fill="#e0f0e9" stroke="#8ea6b2"/>
<text x="208" y="315" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">② フロー制約</text>
<text x="208" y="339" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">例：WIP過多、作業順序の不整合</text>
<text x="208" y="361" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">対策：WIP制限・優先順位・工程調整</text>
<rect x="265" y="385" width="470" height="305" rx="16" fill="#e1edf8" stroke="#8ea6b2"/>
<text x="283" y="415" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">① 物理・能力制約</text>
<text x="283" y="439" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">例：テスト環境不足、レビュアー不足</text>
<text x="283" y="461" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">対策：増強・自動化・育成</text>
<path d="M560.0 560.0 L923.6 117.7" stroke="#c0604a" stroke-width="3" fill="none"/><polygon points="930.0,110.0 927.8,123.7 917.0,114.8" fill="#c0604a"/>
<text x="500" y="722" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#c0604a">赤い矢印：AIで内側の制約を解くほど、制約は外側（制度・市場）へ移る</text>
<text x="500" y="750" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">経営分析向けの整理であり、TOCの公式分類ではない。開発生産性の改善と企業経営の改善を結ぶ境界は③と④にある</text>
</svg>
