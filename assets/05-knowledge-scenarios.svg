<text x="500" y="582" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">K(t+1) = (1−δ)K(t) + αE + βR。E=30（案件経験）、R=10（改善投資）、β=1.0、K0=100</text>
<text x="500" y="608" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">仮想値。案件経験が同じでも、変換効率αが低ければ組織知は増えず、保守を怠ればδが上がって到達点が下がる</text>
