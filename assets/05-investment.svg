<text x="500" y="560" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">構築1,000時間、年20案件×40時間削減、保守200時間/年。API費用、品質差、資金の時間価値、需要不確実性は含まない</text>
