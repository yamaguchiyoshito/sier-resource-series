<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-label="連載の全体像：資源から制約へ、制約から経営モデルへ">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="51" font-family="sans-serif" font-size="27" font-weight="700" fill="#18324b">連載の全体像：資源から制約へ、制約から経営モデルへ</text>
<rect x="100" y="76" width="800" height="80" rx="12" fill="#e1edf8" stroke="#8ea6b2"/>
<text x="500" y="107" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">第1回 経営資源とは何か</text>
<text x="500" y="135" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">保有量ではなく、資源を何に変換できるかを問う</text>
<path d="M500 157 v24" stroke="#607a91" stroke-width="3"/>
<path d="M492 174 l8 8 8 -8" fill="none" stroke="#607a91" stroke-width="3"/>
<rect x="100" y="184" width="800" height="80" rx="12" fill="#e0f0e9" stroke="#8ea6b2"/>
<text x="500" y="215" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">第2回 分類体系</text>
<text x="500" y="243" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">種類・性質・能力の階層・戦略価値の多軸で資源を見る</text>
<path d="M500 265 v24" stroke="#607a91" stroke-width="3"/>
<path d="M492 282 l8 8 8 -8" fill="none" stroke="#607a91" stroke-width="3"/>
<rect x="100" y="292" width="800" height="80" rx="12" fill="#f7e9d4" stroke="#8ea6b2"/>
<text x="500" y="323" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">第3回 流れと変換</text>
<text x="500" y="351" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">Stock・Flow・Feedbackで企業を動的なシステムとして捉える</text>
<path d="M500 373 v24" stroke="#607a91" stroke-width="3"/>
<path d="M492 390 l8 8 8 -8" fill="none" stroke="#607a91" stroke-width="3"/>
<rect x="100" y="400" width="800" height="80" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="500" y="431" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">第4回 配分と制約</text>
<text x="500" y="459" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">全資源の稼働最大化と全体価値の最大化は一致しない</text>
<path d="M500 481 v24" stroke="#607a91" stroke-width="3"/>
<path d="M492 498 l8 8 8 -8" fill="none" stroke="#607a91" stroke-width="3"/>
<rect x="100" y="508" width="800" height="80" rx="12" fill="#f6e4e8" stroke="#8ea6b2"/>
<text x="500" y="539" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">第5回 AI時代のSIer経営モデル</text>
<text x="500" y="567" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">競争優位は実装速度ではなく、検証・資産化・変革の能力</text>
<path d="M100 548 H60 V116" fill="none" stroke="#607a91" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M60 116 H92" stroke="#607a91" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M84 108 l8 8 -8 8" fill="none" stroke="#607a91" stroke-width="3"/>
<text x="500" y="640" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5d6c75">蓄積した能力は次の資源になる。第5回の出口は第1回の入口へ戻る（破線）</text>
<text x="500" y="668" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">各回の「本稿の問い」は第6回のチェックリストに集約する</text>
</svg>
