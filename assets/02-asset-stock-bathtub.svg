<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="552" viewBox="0 0 1000 552" role="img" aria-label="蛇口を開ければすぐ満たせる購入資源の浴槽と、流入速度に上限がある蓄積資源の浴槽の比較">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">買える資源と、蓄積しなければ得られない資源</text>
<text x="260" y="108" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#223e53">購入・調達できる資源</text>
<path d="M80 200 V380 Q80 410 110 410 H410 Q440 410 440 380 V200" fill="#fff" stroke="#607a91" stroke-width="3"/>
<path d="M86 244 V378 Q86 404 110 404 H410 Q434 404 434 378 V244 Z" fill="#e1edf8"/>
<rect x="180" y="140" width="110" height="12" rx="4" fill="#607a91"/>
<rect x="240" y="150" width="40" height="28" rx="4" fill="#607a91"/>
<rect x="238" y="178" width="44" height="66" fill="#bcd3e6" opacity="0.85"/>
<text x="260" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">AIモデルのAPI利用権、CI/CDサービス</text>
<text x="260" y="464" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">テスト自動化ツール、外部の専門技術者</text>
<text x="260" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#607a91">蛇口を開ければすぐ満たせる</text>
<text x="740" y="108" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#223e53">内部で蓄積する必要がある資源</text>
<path d="M560 200 V380 Q560 410 590 410 H890 Q920 410 920 380 V200" fill="#fff" stroke="#607a91" stroke-width="3"/>
<path d="M566 344 V378 Q566 404 590 404 H890 Q914 404 914 378 V344 Z" fill="#e1edf8"/>
<rect x="660" y="140" width="110" height="12" rx="4" fill="#607a91"/>
<rect x="720" y="150" width="40" height="28" rx="4" fill="#607a91"/>
<rect x="736" y="178" width="8" height="166" fill="#bcd3e6" opacity="0.85"/>
<text x="740" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">AIを使いこなす組織能力、検証の習慣</text>
<text x="740" y="464" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">システム固有のテスト知識、チーム間の協調関係</text>
<text x="740" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#c0604a">流入速度に上限があり、時間がかかる</text>
<path d="M920 372 H975" stroke="#c0604a" stroke-width="3" stroke-dasharray="6 4"/>
<text x="985" y="355" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0604a">陳腐化・離職で流出</text>
<text x="500" y="505" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">ディーリックス／クール（1989）の資産ストックの比喩。</text>
<text x="500" y="527" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">資金を一気に投じても蓄積資産の流入は速くならず、この時間差が競争優位の持続性を生む</text>
</svg>
