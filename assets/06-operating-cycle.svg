<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="735" viewBox="0 0 1000 735" role="img" aria-label="測る、制約を特定する、配分する、実行する、資産化する、再評価するの6段階を円環で示した経営の運転サイクル">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">経営の運転サイクル：測る → 制約 → 配分 → 実行 → 資産化 → 再評価</text>
<circle cx="500" cy="405" r="240" fill="none" stroke="#607a91" stroke-width="3"/>
<polygon points="629.5,202.7 616.2,185.7 608.2,199.6" fill="#607a91"/>
<polygon points="740.0,416.0 748.0,396.0 732.0,396.0" fill="#607a91"/>
<polygon points="610.5,618.3 631.8,615.3 623.8,601.4" fill="#607a91"/>
<polygon points="370.5,607.3 383.8,624.3 391.8,610.4" fill="#607a91"/>
<polygon points="260.0,394.0 252.0,414.0 268.0,414.0" fill="#607a91"/>
<polygon points="389.5,191.7 368.2,194.7 376.2,208.6" fill="#607a91"/>
<rect x="398" y="135" width="205" height="60" rx="12" fill="#e1edf8" stroke="#8ea6b2" stroke-width="1"/><text x="500" y="161" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">① 測る</text><text x="500" y="185" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">流入・完了・滞留・変動</text>
<rect x="605" y="255" width="205" height="60" rx="12" fill="#e0f0e9" stroke="#8ea6b2" stroke-width="1"/><text x="708" y="281" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">② 制約を特定する</text><text x="708" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">TOC、制約の4階層</text>
<rect x="605" y="495" width="205" height="60" rx="12" fill="#f7e9d4" stroke="#8ea6b2" stroke-width="1"/><text x="708" y="521" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">③ 配分する</text><text x="708" y="545" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">限界価値、探索と深化</text>
<rect x="398" y="615" width="205" height="60" rx="12" fill="#e9e4f5" stroke="#8ea6b2" stroke-width="1"/><text x="500" y="641" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">④ 実行する</text><text x="500" y="665" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">責務分離、自律度、WIP制限</text>
<rect x="190" y="495" width="205" height="60" rx="12" fill="#f6e4e8" stroke="#8ea6b2" stroke-width="1"/><text x="292" y="521" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">⑤ 資産化する</text><text x="292" y="545" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">7変換、SECI、L2へ横展開</text>
<rect x="190" y="255" width="205" height="60" rx="12" fill="#e1edf8" stroke="#8ea6b2" stroke-width="1"/><text x="292" y="281" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">⑥ 再評価する</text><text x="292" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">制約の移動、能力の更新</text>
<text x="500" y="392" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">R：① → ⑤ → ① の強化ループ</text>
<text x="500" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">B：② ③ ④ で滞留を制御</text>
<text x="500" y="706" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">6段階のどれか一つを省くと残りが機能しない。測らずに制約は見つからず、資産化しなければ生産性は複利にならない</text>
</svg>
