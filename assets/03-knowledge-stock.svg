<text x="500" y="560" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">K(t+1) = 0.9 K(t) + 25、K(0) = 100。「知識資産指数」は定義して測る必要があり、図は実測値ではない</text>
