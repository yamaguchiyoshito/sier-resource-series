<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-label="知識資産指数の6年間の推移。毎年追加すると170へ増え、4年目以降に追加を止めると10%の劣化で103まで下がる">
