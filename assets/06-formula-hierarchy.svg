<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-label="蓄積、流れ、配分、投資評価、境界の5段に連載の数式を対応させ、上の段の答えが下の段の前提になることを示す図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="51" text-anchor="start" font-family="sans-serif" font-size="27" font-weight="700" fill="#18324b">問いの階層：下の問いは上の問いの答えを前提にする</text>
<rect x="220" y="90" width="560" height="76" rx="12" fill="#e1edf8" stroke="#8ea6b2"/>
<text x="238" y="120" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">1. 蓄積</text>
<text x="238" y="144" text-anchor="start" font-family="sans-serif" font-size="13" fill="#5d6c75">資源はどう増減するか</text>
<text x="762" y="120" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">S(t+1) = S(t) + A(t) − D(t)　／　K(t+1) = (1−δ)K(t) + αE(t) + βR(t)</text>
<text x="762" y="144" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5d6c75">第2回・第3回・第5回</text>
<path d="M500.0 166.0 L500.0 178.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="500.0,188.0 493.0,176.0 507.0,176.0" fill="#607a91"/>
<rect x="180" y="188" width="640" height="76" rx="12" fill="#e0f0e9" stroke="#8ea6b2"/>
<text x="198" y="218" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">2. 流れ</text>
<text x="198" y="242" text-anchor="start" font-family="sans-serif" font-size="13" fill="#5d6c75">仕事はどれだけ滞留するか</text>
<text x="802" y="218" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">L = λW　／　Wq = ρ ÷ ( μ(1−ρ) )</text>
<text x="802" y="242" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5d6c75">第4回</text>
<path d="M500.0 264.0 L500.0 276.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="500.0,286.0 493.0,274.0 507.0,274.0" fill="#607a91"/>
<rect x="140" y="286" width="720" height="76" rx="12" fill="#f7e9d4" stroke="#8ea6b2"/>
<text x="158" y="316" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">3. 配分</text>
<text x="158" y="340" text-anchor="start" font-family="sans-serif" font-size="13" fill="#5d6c75">資源をどこへ配分するか</text>
<text x="842" y="316" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">max V(x)  s.t.  Ax ≤ b　／　MVi = ∂V/∂xi</text>
<text x="842" y="340" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5d6c75">第4回</text>
<path d="M500.0 362.0 L500.0 374.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="500.0,384.0 493.0,372.0 507.0,372.0" fill="#607a91"/>
<rect x="100" y="384" width="800" height="76" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="118" y="414" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">4. 投資評価</text>
<text x="118" y="438" text-anchor="start" font-family="sans-serif" font-size="13" fill="#5d6c75">共通資産は割に合うか</text>
<text x="882" y="414" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">V_asset = Σ(ΔCi − C_apply,i) − C_build − C_maint</text>
<text x="882" y="438" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5d6c75">第2回・第3回・第5回</text>
<path d="M500.0 460.0 L500.0 472.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="500.0,482.0 493.0,470.0 507.0,470.0" fill="#607a91"/>
<rect x="60" y="482" width="880" height="76" rx="12" fill="#f6e4e8" stroke="#8ea6b2"/>
<text x="78" y="512" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">5. 境界</text>
<text x="78" y="536" text-anchor="start" font-family="sans-serif" font-size="13" fill="#5d6c75">内製か外注か</text>
<text x="922" y="512" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">C_internal  vs.  C_external + C_coordination + C_risk</text>
<text x="922" y="536" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5d6c75">第5回</text>
<text x="500" y="600" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d6c75">滞留を測らずに配分は決められず、資産の価値を測らずに内製と外注は比べられない。上の段の答えが下の段の入力になる</text>
</svg>
