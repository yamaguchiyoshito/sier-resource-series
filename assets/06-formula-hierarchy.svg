<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="636" viewBox="0 0 1000 636" role="img" aria-label="蓄積、流れ、配分、投資評価、境界の5段に連載の数式を対応させ、上の段の答えが下の段の前提になることを示す図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">問いの階層：下の問いは上の問いの答えを前提にする</text>
<rect x="200" y="88" width="600" height="78" rx="12" fill="#e1edf8" stroke="#8ea6b2"/>
<text x="218" y="118" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">1. 蓄積</text>
<text x="218" y="144" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">資源はどう増減するか</text>
<text x="782" y="118" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">S(t+1) = S(t) + A(t) − D(t)　／　K(t+1) = (1−δ)K(t) + αE(t) + βR(t)</text>
<text x="782" y="144" text-anchor="end" font-family="sans-serif" font-size="14" fill="#5d6c75">第2回・第3回・第5回</text>
<path d="M500.0 166.0 L500.0 178.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="500.0,188.0 493.0,176.0 507.0,176.0" fill="#607a91"/>
<rect x="160" y="188" width="680" height="78" rx="12" fill="#e0f0e9" stroke="#8ea6b2"/>
<text x="178" y="218" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">2. 流れ</text>
<text x="178" y="244" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">仕事はどれだけ滞留するか</text>
<text x="822" y="218" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">L = λW　／　Wq = ρ ÷ ( μ(1−ρ) )</text>
<text x="822" y="244" text-anchor="end" font-family="sans-serif" font-size="14" fill="#5d6c75">第4回</text>
<path d="M500.0 266.0 L500.0 278.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="500.0,288.0 493.0,276.0 507.0,276.0" fill="#607a91"/>
<rect x="120" y="288" width="760" height="78" rx="12" fill="#f7e9d4" stroke="#8ea6b2"/>
<text x="138" y="318" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">3. 配分</text>
<text x="138" y="344" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">資源をどこへ配分するか</text>
<text x="862" y="318" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">max V(x)  s.t.  Ax ≤ b　／　MVi = ∂V/∂xi</text>
<text x="862" y="344" text-anchor="end" font-family="sans-serif" font-size="14" fill="#5d6c75">第4回</text>
<path d="M500.0 366.0 L500.0 378.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="500.0,388.0 493.0,376.0 507.0,376.0" fill="#607a91"/>
<rect x="80" y="388" width="840" height="78" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="98" y="418" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">4. 投資評価</text>
<text x="98" y="444" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">共通資産は割に合うか</text>
<text x="902" y="418" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">V_asset = Σ(ΔCi − C_apply,i) − C_build − C_maint</text>
<text x="902" y="444" text-anchor="end" font-family="sans-serif" font-size="14" fill="#5d6c75">第2回・第3回・第5回</text>
<path d="M500.0 466.0 L500.0 478.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="500.0,488.0 493.0,476.0 507.0,476.0" fill="#607a91"/>
<rect x="40" y="488" width="920" height="78" rx="12" fill="#f6e4e8" stroke="#8ea6b2"/>
<text x="58" y="518" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="700" fill="#223e53">5. 境界</text>
<text x="58" y="544" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">内製か外注か</text>
<text x="942" y="518" text-anchor="end" font-family="sans-serif" font-size="14" fill="#223e53">C_internal  vs.  C_external + C_coordination + C_risk</text>
<text x="942" y="544" text-anchor="end" font-family="sans-serif" font-size="14" fill="#5d6c75">第5回</text>
<text x="500" y="606" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">滞留を測らずに配分は決められず、資産の価値を測らずに内製と外注は比べられない。上の段の答えが下の段の入力になる</text>
</svg>
