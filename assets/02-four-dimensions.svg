<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-label="一つの資源を種類・性質・機能・戦略価値の4次元から見る図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="51" text-anchor="start" font-family="sans-serif" font-size="27" font-weight="700" fill="#18324b">経営資源を4つの次元で捉える</text>
<rect x="380" y="298" width="240" height="84" rx="12" fill="#fff" stroke="#607a91"/><text x="500" y="336" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#223e53">ある資源</text><text x="500" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">例：Agent Skill</text>
<rect x="355.0" y="82.0" width="290" height="96" rx="12" fill="#e1edf8" stroke="#8ea6b2"/>
<text x="500" y="116" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#223e53">① 種類</text>
<text x="500" y="139" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">何を持っているか</text>
<text x="500" y="161" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5d6c75">技術資源・知識資源</text>
<path d="M500 298 V178.0" stroke="#607a91" stroke-width="3"/>
<rect x="355.0" y="502.0" width="290" height="96" rx="12" fill="#e0f0e9" stroke="#8ea6b2"/>
<text x="500" y="536" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#223e53">② 性質</text>
<text x="500" y="559" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">どう振る舞うか</text>
<text x="500" y="581" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5d6c75">複製可能・非競合・陳腐化する</text>
<path d="M500 382 V502.0" stroke="#607a91" stroke-width="3"/>
<rect x="25.0" y="292.0" width="290" height="96" rx="12" fill="#f7e9d4" stroke="#8ea6b2"/>
<text x="170" y="326" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#223e53">③ 機能</text>
<text x="170" y="349" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">何を実現できるか</text>
<text x="170" y="371" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5d6c75">自律検証という組織能力の構成要素</text>
<path d="M380 340 H315.0" stroke="#607a91" stroke-width="3"/>
<rect x="685.0" y="292.0" width="290" height="96" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="830" y="326" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#223e53">④ 戦略価値</text>
<text x="830" y="349" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">なぜ優位性を生むか</text>
<text x="830" y="371" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5d6c75">業務知識と統合されるほど模倣困難</text>
<path d="M620 340 H685.0" stroke="#607a91" stroke-width="3"/>
<text x="500" y="640" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d6c75">4次元は独立した分類軸として組み合わせる。既存理論を統合した分析モデルであり、単一の理論ではない</text>
</svg>
