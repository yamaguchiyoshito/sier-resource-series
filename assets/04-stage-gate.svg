<text x="907" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Skill・CIへ展開</text>
<path d="M846 290 H968" stroke="#8ea6b2" stroke-width="2" stroke-dasharray="3 5"/>
<text x="500" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">投入資源は段階ごとに増やし、評価基準は段階ごとに変える（成立性 → 適用性 → 経済価値）</text>
<text x="500" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">短期ROIだけで評価すると能力が形成される前に打ち切られ、評価せずに続ければ資源を消耗する。撤退条件を事前に決める</text>
</svg>
