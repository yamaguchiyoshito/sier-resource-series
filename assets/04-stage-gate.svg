<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525" viewBox="0 0 1000 525" role="img" aria-label="小規模な技術検証から技術成立性、実務適用性、経済価値の3つのゲートを経て既存能力の深化へ進み、各ゲートで撤退も選ぶ段階投資の図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="51" text-anchor="start" font-family="sans-serif" font-size="27" font-weight="700" fill="#18324b">探索投資の段階的な判断：ゲートごとに続行か撤退かを決める</text>
<rect x="60" y="160" width="190" height="300" rx="12" fill="#e1edf8" stroke="#8ea6b2"/><text x="155" y="306" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">小規模な技術検証</text><text x="155" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#36556d">数十時間・1〜2名</text>
<polygon points="280,280 300,310 280,340 260,310" fill="#fff" stroke="#c0604a" stroke-width="2"/>
<text x="280" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0604a">G1</text>
<path d="M302.0 310.0 L308.0 310.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="318.0,310.0 306.0,317.0 306.0,303.0" fill="#607a91"/>
<path d="M280.0 342.0 L280.0 380.0" stroke="#c0604a" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polygon points="280.0,390.0 273.0,378.0 287.0,378.0" fill="#c0604a"/>
<text x="280" y="408" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0604a">撤退</text>
<text x="280" y="424" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5d6c75">学びを記録</text>
<rect x="310" y="185" width="190" height="250" rx="12" fill="#e0f0e9" stroke="#8ea6b2"/><text x="405" y="306" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">技術成立性</text><text x="405" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#36556d">動くか、再現するか</text>
<polygon points="530,280 550,310 530,340 510,310" fill="#fff" stroke="#c0604a" stroke-width="2"/>
<text x="530" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0604a">G2</text>
<path d="M552.0 310.0 L558.0 310.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="568.0,310.0 556.0,317.0 556.0,303.0" fill="#607a91"/>
<path d="M530.0 342.0 L530.0 380.0" stroke="#c0604a" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polygon points="530.0,390.0 523.0,378.0 537.0,378.0" fill="#c0604a"/>
<text x="530" y="408" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0604a">撤退</text>
<text x="530" y="424" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5d6c75">学びを記録</text>
<rect x="560" y="210" width="190" height="200" rx="12" fill="#f7e9d4" stroke="#8ea6b2"/><text x="655" y="306" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">実務適用性</text><text x="655" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#36556d">案件で使えるか、誰が保守するか</text>
<polygon points="780,280 800,310 780,340 760,310" fill="#fff" stroke="#c0604a" stroke-width="2"/>
<text x="780" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0604a">G3</text>
<path d="M802.0 310.0 L808.0 310.0" stroke="#607a91" stroke-width="2" fill="none"/><polygon points="818.0,310.0 806.0,317.0 806.0,303.0" fill="#607a91"/>
<path d="M780.0 342.0 L780.0 380.0" stroke="#c0604a" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polygon points="780.0,390.0 773.0,378.0 787.0,378.0" fill="#c0604a"/>
<text x="780" y="408" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0604a">撤退</text>
<text x="780" y="424" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5d6c75">学びを記録</text>
<rect x="810" y="235" width="190" height="150" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/><text x="905" y="306" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#223e53">経済価値</text><text x="905" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#36556d">純便益と回収期間</text>
<path d="M1010.0 310.0 L1030.0 310.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="1040.0,310.0 1028.0,317.0 1028.0,303.0" fill="#607a91"/>
<rect x="1040" y="255" width="200" height="110" rx="12" fill="#f6e4e8" stroke="#8ea6b2"/><text x="1140" y="306" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">既存能力の深化へ</text><text x="1140" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#36556d">標準・CI・Skillとして展開</text>
<text x="500" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">投入資源は段階ごとに増やし、評価基準は段階ごとに変える（成立性 → 適用性 → 経済価値）</text>
<text x="500" y="500" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d6c75">短期ROIだけで評価すると能力が形成される前に打ち切られ、評価せずに続ければ資源を消耗する。撤退条件を事前に決める</text>
</svg>
