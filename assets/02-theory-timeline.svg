<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615" role="img" aria-label="ペンローズ（1959）からティース（2007）までの経営資源論の系譜と、保有から組み合わせ、変革能力への視点の移行">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">経営資源論の発展：保有から組み合わせへ、そして変革能力へ</text>
<rect x="80" y="92" width="574" height="34" rx="8" fill="#e1edf8" stroke="#8ea6b2"/>
<text x="367" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">資源の保有（ヒト・モノ・カネ・情報）</text>
<rect x="206" y="136" width="532" height="34" rx="8" fill="#e0f0e9" stroke="#8ea6b2"/>
<text x="472" y="159" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">資源の組み合わせ・サービス</text>
<rect x="738" y="180" width="182" height="34" rx="8" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="829" y="203" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">資源そのものを変革する能力</text>
<path d="M80.0 258 H920.0" stroke="#8ea6b2" stroke-width="2"/>
<path d="M80 253 v10" stroke="#8ea6b2" stroke-width="2"/>
<text x="80" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">1950</text>
<path d="M220 253 v10" stroke="#8ea6b2" stroke-width="2"/>
<text x="220" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">1960</text>
<path d="M360 253 v10" stroke="#8ea6b2" stroke-width="2"/>
<text x="360" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">1970</text>
<path d="M500 253 v10" stroke="#8ea6b2" stroke-width="2"/>
<text x="500" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">1980</text>
<path d="M640 253 v10" stroke="#8ea6b2" stroke-width="2"/>
<text x="640" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">1990</text>
<path d="M780 253 v10" stroke="#8ea6b2" stroke-width="2"/>
<text x="780" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">2000</text>
<path d="M920 253 v10" stroke="#8ea6b2" stroke-width="2"/>
<text x="920" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d6c75">2010</text>
<path d="M206 266 L205 310" stroke="#607a91" stroke-width="1.5"/>
<circle cx="206" cy="258" r="7" fill="#607a91" stroke="#fff" stroke-width="2"/>
<rect x="60" y="310" width="290" height="100" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="74" y="336" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">1959　ペンローズ</text>
<text x="74" y="360" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">企業成長の理論</text>
<text x="74" y="384" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">資源と、資源が提供するサービスは異なる</text>
<path d="M626 266 L520 310" stroke="#607a91" stroke-width="1.5"/>
<circle cx="626" cy="258" r="7" fill="#607a91" stroke="#fff" stroke-width="2"/>
<rect x="375" y="310" width="290" height="100" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="389" y="336" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">1989　ディーリックス／クール</text>
<text x="389" y="360" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">資産ストックの蓄積</text>
<text x="389" y="384" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">買える資源と、蓄積する資源を区別する</text>
<path d="M654 266 L835 310" stroke="#607a91" stroke-width="1.5"/>
<circle cx="654" cy="258" r="7" fill="#607a91" stroke="#fff" stroke-width="2"/>
<rect x="690" y="310" width="290" height="100" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="704" y="336" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">1991　バーニー</text>
<text x="704" y="360" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">資源ベース理論（RBV）</text>
<text x="704" y="384" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">希少性・模倣困難性が競争優位を左右する</text>
<path d="M724 266 L205 430" stroke="#607a91" stroke-width="1.5"/>
<circle cx="724" cy="258" r="7" fill="#607a91" stroke="#fff" stroke-width="2"/>
<rect x="60" y="430" width="290" height="100" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="74" y="456" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">1996　グラント</text>
<text x="74" y="480" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">知識ベース理論（KBV）</text>
<text x="74" y="504" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">企業は専門知識を統合する仕組みである</text>
<path d="M738 266 L520 430" stroke="#607a91" stroke-width="1.5"/>
<circle cx="738" cy="258" r="7" fill="#607a91" stroke="#fff" stroke-width="2"/>
<rect x="375" y="430" width="290" height="100" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="389" y="456" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">1997　ティースら</text>
<text x="389" y="480" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">ダイナミック・ケイパビリティ</text>
<text x="389" y="504" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">資源を再構成する能力が経営能力になる</text>
<path d="M878 266 L835 430" stroke="#607a91" stroke-width="1.5"/>
<circle cx="878" cy="258" r="7" fill="#607a91" stroke="#fff" stroke-width="2"/>
<rect x="690" y="430" width="290" height="100" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="704" y="456" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">2007　ティース</text>
<text x="704" y="480" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">変革能力の3要素</text>
<text x="704" y="504" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">Sensing・Seizing・Transforming</text>
<text x="500" y="588" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">視点は「何を持つか」から「どう組み合わせるか」、さらに「資源と能力そのものをどう作り替えるか」へ移ってきた</text>
</svg>
