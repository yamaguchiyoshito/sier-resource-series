<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="716" viewBox="0 0 1000 716" role="img" aria-label="ペンローズ（1959）からティース（2007）までの経営資源論の系譜を縦に並べ、保有から組み合わせ、変革能力への視点の移行を帯で示した図">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">経営資源論の発展：保有から組み合わせへ、そして変革能力へ</text>
<path d="M150 100 V620" stroke="#8ea6b2" stroke-width="3"/>
<text x="132" y="136" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#607a91">1959</text>
<circle cx="150" cy="130" r="8" fill="#607a91" stroke="#fff" stroke-width="2"/>
<path d="M158 130 H180" stroke="#8ea6b2" stroke-width="2"/>
<rect x="180" y="92" width="570" height="76" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="196" y="118" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">ペンローズ</text>
<text x="196" y="140" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">企業成長の理論</text>
<text x="196" y="160" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">資源と、資源が提供するサービスは異なる</text>
<text x="132" y="228" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#607a91">1989</text>
<circle cx="150" cy="222" r="8" fill="#607a91" stroke="#fff" stroke-width="2"/>
<path d="M158 222 H180" stroke="#8ea6b2" stroke-width="2"/>
<rect x="180" y="184" width="570" height="76" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="196" y="210" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">ディーリックス／クール</text>
<text x="196" y="232" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">資産ストックの蓄積</text>
<text x="196" y="252" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">買える資源と、時間をかけて蓄積する資源を区別する</text>
<text x="132" y="320" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#607a91">1991</text>
<circle cx="150" cy="314" r="8" fill="#607a91" stroke="#fff" stroke-width="2"/>
<path d="M158 314 H180" stroke="#8ea6b2" stroke-width="2"/>
<rect x="180" y="276" width="570" height="76" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="196" y="302" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">バーニー</text>
<text x="196" y="324" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">資源ベース理論（RBV）</text>
<text x="196" y="344" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">希少性・模倣困難性が競争優位を左右する</text>
<text x="132" y="412" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#607a91">1996</text>
<circle cx="150" cy="406" r="8" fill="#607a91" stroke="#fff" stroke-width="2"/>
<path d="M158 406 H180" stroke="#8ea6b2" stroke-width="2"/>
<rect x="180" y="368" width="570" height="76" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="196" y="394" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">グラント</text>
<text x="196" y="416" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">知識ベース理論（KBV）</text>
<text x="196" y="436" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">企業は専門知識を統合する仕組みである</text>
<text x="132" y="504" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#607a91">1997</text>
<circle cx="150" cy="498" r="8" fill="#607a91" stroke="#fff" stroke-width="2"/>
<path d="M158 498 H180" stroke="#8ea6b2" stroke-width="2"/>
<rect x="180" y="460" width="570" height="76" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="196" y="486" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">ティースら</text>
<text x="196" y="508" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">ダイナミック・ケイパビリティ</text>
<text x="196" y="528" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">資源を再構成する能力そのものが経営能力になる</text>
<text x="132" y="596" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#607a91">2007</text>
<circle cx="150" cy="590" r="8" fill="#607a91" stroke="#fff" stroke-width="2"/>
<path d="M158 590 H180" stroke="#8ea6b2" stroke-width="2"/>
<rect x="180" y="552" width="570" height="76" rx="10" fill="#fff" stroke="#8ea6b2"/>
<text x="196" y="578" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">ティース</text>
<text x="196" y="600" text-anchor="start" font-family="sans-serif" font-size="14" fill="#36556d">変革能力の3要素</text>
<text x="196" y="620" text-anchor="start" font-family="sans-serif" font-size="14" fill="#5d6c75">Sensing・Seizing・Transforming</text>
<text x="865" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#5d6c75">視点の移り変わり</text>
<rect x="780" y="94" width="48" height="256" rx="10" fill="#e1edf8" stroke="#8ea6b2"/>
<text x="804" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53" transform="rotate(-90 804 222)">資源の保有</text>
<rect x="840" y="94" width="48" height="440" rx="10" fill="#e0f0e9" stroke="#8ea6b2"/>
<text x="864" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53" transform="rotate(-90 864 314)">資源の組み合わせ・サービス</text>
<rect x="900" y="462" width="48" height="164" rx="10" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="924" y="544" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53" transform="rotate(-90 924 544)">資源と能力の変革</text>
<text x="500" y="666" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">視点は「何を持つか」から「どう組み合わせるか」、さらに「資源と能力をどう作り替えるか」へ移ってきた</text>
<text x="500" y="688" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5d6c75">行は等間隔に並べており、年の間隔には比例しない</text>
</svg>
