<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="MR作成、レビュー可能状態、初回レビュー、承認、マージの5つの計測点と、レビュー待ち時間・MRリードタイムなどの区間の対応">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="51" text-anchor="start" font-family="sans-serif" font-size="27" font-weight="700" fill="#18324b">MRのライフサイクルと計測点</text>
<path d="M120 250 H920" stroke="#8ea6b2" stroke-width="3"/>
<circle cx="120" cy="250" r="11" fill="#fcfdfd" stroke="#607a91" stroke-width="3"/>
<text x="120" y="214" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">MR作成</text>
<text x="120" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5d6c75"></text>
<circle cx="320" cy="250" r="11" fill="#fcfdfd" stroke="#607a91" stroke-width="3"/>
<text x="320" y="214" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">レビュー可能状態</text>
<text x="320" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5d6c75">Draft解除／レビュー依頼</text>
<circle cx="520" cy="250" r="11" fill="#fcfdfd" stroke="#607a91" stroke-width="3"/>
<text x="520" y="214" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">初回レビュー</text>
<text x="520" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5d6c75">最初のコメント・承認</text>
<circle cx="720" cy="250" r="11" fill="#fcfdfd" stroke="#607a91" stroke-width="3"/>
<text x="720" y="214" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">承認</text>
<text x="720" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5d6c75">必要承認数の充足</text>
<circle cx="920" cy="250" r="11" fill="#fcfdfd" stroke="#607a91" stroke-width="3"/>
<text x="920" y="214" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">マージ</text>
<text x="920" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5d6c75">対象ブランチへ統合</text>
<path d="M320 292 V300 H520 V292" stroke="#c0604a" stroke-width="2" fill="none"/>
<text x="420" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0604a">レビュー待ち時間（レビュー制約）</text>
<path d="M520 292 V300 H720 V292" stroke="#607a91" stroke-width="2" fill="none"/>
<text x="620" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#607a91">レビュー作業・差し戻し</text>
<path d="M720 292 V300 H920 V292" stroke="#607a91" stroke-width="2" fill="none"/>
<text x="820" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#607a91">統合待ち（CI・コンフリクト）</text>
<path d="M120 362 V370 H920 V362" stroke="#223e53" stroke-width="2" fill="none"/>
<text x="520" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">MRリードタイム（統合速度）</text>
<rect x="120" y="128" width="800" height="34" rx="8" fill="#f7e9d4" stroke="#8ea6b2"/>
<text x="520" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">Open MR ＝ 作成済みで未マージ（期末の件数が滞留Stock）</text>
<text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#607a91">MR作成数</text>
<text x="120" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5d6c75">週次の流入量</text>
<text x="920" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#607a91">MRマージ数</text>
<text x="920" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5d6c75">週次の処理能力</text>
<text x="500" y="445" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5d6c75">手戻り率：初回レビュー以降に差し戻しが発生したMRの割合　／　レビュアー負荷：担当中のOpen MR数と必要レビュー工数</text>
<text x="500" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d6c75">「レビュー可能状態」をDraft解除時刻にするかレビュー依頼イベントにするかで待ち時間が変わる。組織で定義を統一してから計測する</text>
</svg>
