<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="Stock・Flow・Transformation・Feedback">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="51" font-family="sans-serif" font-size="27" font-weight="700" fill="#18324b">Stock・Flow・Transformation・Feedback</text>
<rect x="100" y="76" width="800" height="80" rx="12" fill="#e1edf8" stroke="#8ea6b2"/>
<text x="500" y="107" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">流入 Flow</text>
<text x="500" y="135" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">採用・投資・知識獲得・新しい仕事</text>
<path d="M500 157 v24" stroke="#607a91" stroke-width="3"/>
<path d="M492 174 l8 8 8 -8" fill="none" stroke="#607a91" stroke-width="3"/>
<rect x="100" y="184" width="800" height="80" rx="12" fill="#e0f0e9" stroke="#8ea6b2"/>
<text x="500" y="215" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">蓄積 Stock</text>
<text x="500" y="243" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">人的能力・知識資産・未完了作業</text>
<path d="M500 265 v24" stroke="#607a91" stroke-width="3"/>
<path d="M492 282 l8 8 8 -8" fill="none" stroke="#607a91" stroke-width="3"/>
<rect x="100" y="292" width="800" height="80" rx="12" fill="#f7e9d4" stroke="#8ea6b2"/>
<text x="500" y="323" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">変換 Transformation</text>
<text x="500" y="351" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">生産・標準化・教育・自動化</text>
<path d="M500 373 v24" stroke="#607a91" stroke-width="3"/>
<path d="M492 390 l8 8 8 -8" fill="none" stroke="#607a91" stroke-width="3"/>
<rect x="100" y="400" width="800" height="80" rx="12" fill="#e9e4f5" stroke="#8ea6b2"/>
<text x="500" y="431" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">成果と流出 Output</text>
<text x="500" y="459" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">顧客価値・利益・消費・陳腐化</text>
<path d="M500 481 v24" stroke="#607a91" stroke-width="3"/>
<path d="M492 498 l8 8 8 -8" fill="none" stroke="#607a91" stroke-width="3"/>
<rect x="100" y="508" width="800" height="80" rx="12" fill="#edf0f3" stroke="#8ea6b2"/>
<text x="500" y="539" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#223e53">フィードバック Feedback</text>
<text x="500" y="567" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#36556d">評価・再投資・ルール更新</text>
<text x="500" y="680" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5d6c75">線形表示した概念図。最終段階から前工程へ学習が戻る</text>
</svg>
